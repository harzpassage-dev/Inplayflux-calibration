name = "moneybag-access"
main = "src/index.js"
compatibility_date = "2026-09-01"
# Keep variables set in the Cloudflare dashboard (e.g. PREMIUM_CHANNEL_ID,
# ADMIN_CHAT_ID) when deploying from Git - otherwise a deploy drops any
# plaintext var that isn't listed here. Secrets are never touched.
keep_vars = true

[assets]
directory = "./public"
binding = "ASSETS"
# Without this, Cloudflare serves matching static assets straight from the
# edge (even /index.html) without ever invoking fetch() below - which would
# skip the access-token check entirely. This forces the Worker to run first
# for every request.
run_worker_first = true

# Every minute: live-confirm queued premium signals (see processPendingPremium).
[triggers]
crons = ["* * * * *"]

[[kv_namespaces]]
binding = "ACCESS_KV"
id = "4adee62e97ef429cac51cc3019d48a18"

# Set with: npx wrangler secret put ADMIN_PASSWORD
# Never commit the actual password.
