<!doctype html><html><head><meta charset="utf-8"><style>

.n{position:absolute;top:10px;left:12px;background:#e0262f;color:#fff;font:900 22px "Liberation Sans";padding:2px 10px;z-index:5}
.w{background:#fff}.k{background:#111}

<!-- 1 Speed -->

<text font-family="Liberation Sans" font-weight="700" font-size="16" fill="#e0262f" letter-spacing="4"><textPath href="#arc2" startOffset="50%" text-anchor="middle">SIGNALS · EST. 2026</textPath></text>

<defs><filter id="gl" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
<text x="280" y="128" text-anchor="middle" font-family="Liberation Sans" font-size="96" fill="none" stroke="#ff3b44" stroke-width="4" filter="url(#gl)" letter-spacing="2">moneybag</text>

<text x="218" y="160" font-family="Liberation Sans" font-size="20" fill="#e0262f" letter-spacing="3">ZAHLEN STATT GEFÜHL</text></svg></div>

<div class="c" id="l10" style="background:#ffe14d"><span class="n">10</span><svg width="560" height="220" viewBox="0 0 560 220">
<g transform="rotate(-6 280 110)"><rect x="40" y="45" width="480" height="130" rx="65" fill="#111"/>
<text x="280" y="138" text-anchor="middle" font-family="Liberation Sans" font-weight="700" font-size="78" fill="#fff" letter-spacing="-1">money<tspan fill="#ff3b44">bag</tspan></text>
<text x="470" y="80" font-size="44">⚡</text></g></svg></div>
